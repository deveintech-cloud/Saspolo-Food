
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Elengi Ya Malewa | Modern Gastronomy</title>
    
    <!-- Environment Shim for Static Hosting (Must be first) -->
    <script>
      window.process = { env: { API_KEY: "" } };
      // Catch early loading errors
      window.onerror = function(msg, url, line, col, error) {
        console.error("Critical Load Error: ", msg, "\nAt: ", url, ":", line);
        const root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = `<div style="color:white; background:#111; padding:20px; font-family:sans-serif; text-align:center; height:100vh; display:flex; flex-direction:column; justify-content:center;">
            <h1 style="color:#f97316">Application Error</h1>
            <p style="color:#888">The application failed to start. This is often due to file path issues on GitHub Pages.</p>
            <code style="background:#222; padding:10px; border-radius:5px; margin-top:10px; display:inline-block;">${msg}</code>
            <p style="margin-top:20px"><button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">Retry Loading</button></p>
          </div>`;
        }
      };
    </script>

    <!-- Meta Tags for All Platforms -->
    <meta name="description" content="Luxury culinary experience featuring curated seasonal menus, an AI Sommelier, and world-class gastronomy.">
    <meta name="keywords" content="Elengi Ya Malewa, Restaurant, Fine Dining, Gastronomy, AI Chef, Reservations, Congolese Food">
    <meta name="theme-color" content="#09090b">
    
    <!-- Open Graph / Facebook -->

    <link rel="icon" type="image/png" sizes="16x16" href="https://img.icons8.com/ios-filled/16/f97316/restaurant.png">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        @keyframes spin-slow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes reverse-spin {
          from { transform: rotate(360deg); }
          to { transform: rotate(0deg); }
        }
        .animate-spin-slow {
          animation: spin-slow 12s linear infinite;
        }
        .animate-reverse-spin {
          animation: reverse-spin 8s linear infinite;
        }
    </style>
